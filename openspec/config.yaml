schema: spec-driven

context: |
  VideoAI is a prototype Video AI web application. The prototype should prove an
  end-to-end chat-driven video generation loop:

  1. Load sample assets from devassets/catalog.yaml and devassets/media/.
  2. Let the user describe a desired video in a chat interface.
  3. Search seeded clips from generated local files with in-memory retrieval.
  4. Let the user select candidate clips.
  5. Generate a structured EditPlan JSON from the prompt and selected clips.
  6. Deterministically convert the EditPlan into rich vspec YAML.
  7. Render the final video through a Go render service using gldraphael/vspec
     and FFmpeg.

  The MVP should showcase vspec's ability to create polished videos. Retrieval
  only needs to be good enough to supply plausible clips. Do not include vector
  embeddings or pgvector in the MVP.

  Prototype scope:
  - Keep rich vspec generation: trims, explicit timelines, transitions, fades,
    title/color scenes, text overlays, logo/image overlays, audio beds, and
    output settings.
  - Use devassets, not fixtures, for local sample media and the seed catalog.
  - Use a TypeScript seed CLI to probe media, transcribe where useful, chunk
    transcripts, and write generated local media state under var/.
  - Use in-memory retrieval over generated devasset library and transcript
    files for the current local demo.
  - Keep a clean AI boundary: the LLM produces validated EditPlan JSON; the
    backend validates IDs/timestamps/assets and converts to vspec.
  - Put vspec validation/rendering behind a Go service using
    github.com/gldraphael/vspec, FFmpeg, and ffprobe.
  - Containerize everything for local development with Podman Compose.

  Out of scope for the prototype:
  - Auth, users, accounts, workspaces, permissions, sharing, billing, admin.
  - Upload UI and production asset ingestion.
  - Production worker orchestration.
  - Vector embeddings, pgvector, or external search clusters.
  - A full timeline editor.

  Intended services and stack:
  - web: React + TypeScript, Vite, assistant-ui, TanStack Query, Tailwind or
    shadcn-style components.
  - api: Node.js + TypeScript, Fastify, validation, in-memory retrieval,
    OpenAI/AI SDK integration.
  - seed: TypeScript CLI using tsx, ffprobe/FFmpeg, OpenAI transcription or an
    optional local Whisper-compatible tool.
  - render: Go service using github.com/gldraphael/vspec plus FFmpeg/ffprobe.
  - Database-backed persistence is deferred until conversations, render jobs,
    larger catalogs, or retrieval requirements need a concrete data model.

  ADR 0001 captures the high-level direction. It is not a complete
  implementation specification. Detailed phase scope, APIs, schemas, prompts,
  UI behavior, and acceptance criteria should be refined as development
  progresses and each Minimal Testable Product exposes new constraints.

rules:
  proposal:
    - Treat ADR 0001 as directional context rather than a frozen implementation spec.
    - Keep proposals focused on a Minimal Testable Product with a clear user-visible outcome.
    - Include non-goals when a change could otherwise expand into auth, uploads, embeddings, or timeline editing.
  design:
    - Preserve the EditPlan-to-vspec boundary; do not trust raw model-generated vspec as the source of truth.
    - Prefer generated files under var/ and in-memory retrieval for the current local demo; introduce database-backed persistence only through a later proposal with a concrete data model.
    - Prefer Podman-compatible local development instructions and avoid Docker-only assumptions.
    - Keep vspec feature usage rich enough to demonstrate polished rendered output.
  tasks:
    - Organize tasks by testable increments that can be validated at the end of each phase.
    - Include container, seed-data, API, UI, and render-service verification where relevant.
  specs:
    - Requirements should focus on observable behavior and acceptance scenarios.
    - Phase details may be refined during implementation as long as the high-level prototype direction is preserved.
