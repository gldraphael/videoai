services:
  traefik:
    image: docker.io/library/traefik:v3
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8082
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --ping=true
      - --ping.entrypoint=traefik
    ports:
      - "${TRAEFIK_PORT:-8080}:8080"
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro,z
    depends_on:
      - webapp
      - api
      - render
    healthcheck:
      test:
        [
          "CMD",
          "traefik",
          "healthcheck",
          "--ping",
          "--entrypoints.traefik.address=:8082",
          "--ping.entrypoint=traefik"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videoai}
      POSTGRES_USER: ${POSTGRES_USER:-videoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoai}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Containerfile.api
    environment:
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://videoai:videoai@postgres:5432/videoai}
      DEVASSETS_DIR: /data/devassets
      RENDERS_DIR: /data/renders
      THUMBNAILS_DIR: /data/thumbnails
    expose:
      - "8080"
    volumes:
      - ./devassets:/app/devassets:ro,z
      - ./var/devassets:/data/devassets:z
      - ./var/renders:/data/renders:z
      - ./var/thumbnails:/data/thumbnails:z
    depends_on:
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  render:
    build:
      context: .
      dockerfile: Containerfile.render
    environment:
      RENDER_PORT: "8081"
      DEVASSETS_DIR: /data/devassets
      RENDERS_DIR: /data/renders
      THUMBNAILS_DIR: /data/thumbnails
    expose:
      - "8081"
    volumes:
      - ./devassets:/app/devassets:ro,z
      - ./var/devassets:/data/devassets:z
      - ./var/renders:/data/renders:z
      - ./var/thumbnails:/data/thumbnails:z
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  webapp:
    build:
      context: .
      dockerfile: Containerfile.web
    environment:
      WEBAPP_PORT: "5173"
    expose:
      - "5173"
    depends_on:
      - api
      - render
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: Containerfile.seed
    environment:
      DEVASSETS_DIR: /data/devassets
      THUMBNAILS_DIR: /data/thumbnails
      WHISPER_MODEL: /models/ggml-base.en.bin
      WHISPER_LANGUAGE: auto
    depends_on:
      - traefik
    volumes:
      - ./devassets:/app/devassets:ro,z
      - ./var/devassets:/data/devassets:z
      - ./var/thumbnails:/data/thumbnails:z
    command: ["pnpm", "--filter", "@videoai/seed", "seed:devassets", "devassets/catalog.yaml"]

volumes:
  postgres-data:
